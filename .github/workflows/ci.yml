name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (PEA.sln)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/PEA/PEA.sln

      - name: Build
        run: dotnet build src/PEA/PEA.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test src/PEA/PEA.Tests/PEA.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

  tsp-reference:
    name: TSP reference run (bit-identical result)
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run TSP example
        working-directory: src/PEA/Examples/PEA_TSP_Example
        run: dotnet run -c Release | tee tsp-output.txt

      - name: Check result
        working-directory: src/PEA/Examples/PEA_TSP_Example
        run: |
          grep -q "Best distance: 7849.395176892104" tsp-output.txt
          grep -q "Entities: 9006240 " tsp-output.txt

  observer-app:
    name: Build PEA.ObserverApp (outside PEA.sln)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build PEA.ObserverApp
        run: dotnet build src/PEA/PEA.ObserverApp/PEA.ObserverApp.csproj -c Release
